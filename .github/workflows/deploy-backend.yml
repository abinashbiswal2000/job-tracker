name: Deploy Backend

on:
  push:
    branches: [master]
    paths:
      - "Backend/**"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_BACKEND_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Deploy on EC2 via SSM
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          SCRIPT='sudo -u ec2-user -H bash -lc "cd /home/ec2-user/job-tracker && git pull origin master && cd Backend && npm ci && npx prisma migrate deploy && npx prisma generate && npm run build && pm2 restart job-tracker-api --update-env"'
          PARAMS=$(jq -n --arg c "$SCRIPT" '{commands: [$c]}')

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "GitHub deploy ${GITHUB_SHA}" \
            --timeout-seconds 600 \
            --parameters "$PARAMS" \
            --query "Command.CommandId" --output text)
          echo "Command ID: $CMD_ID"

          sleep 5
          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" || true

          STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query Status --output text)
          echo "Status: $STATUS"
          echo "----- OUTPUT -----"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text
          echo "----- ERRORS -----"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text

          [ "$STATUS" = "Success" ]